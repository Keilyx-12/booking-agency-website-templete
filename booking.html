<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Your Slot - Apex Lab</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', system-ui, sans-serif;
        }
        body {
            background-color: #050507;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* Simple Navigation to keep branding consistent */
        .nav-bar {
            width: 100%;
            height: 70px;
            background-color: rgba(5, 5, 7, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .nav-bar__logo {
            font-size: 24px;
            letter-spacing: -0.04em;
            font-weight: bold;
            text-decoration: none;
            color: white;
        }
        .back-home-link {
            font-size: 14px;
            color: #a1a1aa;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .back-home-link:hover {
            color: white;
        }

        /* Booking Container Layout */
        .booking-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background: radial-gradient(circle at center, rgba(225, 29, 72, 0.03) 0%, transparent 70%);
        }
        .booking-card {
            background-color: #0c0c0e;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            width: 100%;
            max-width: 850px;
            padding: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            min-height: 600px;
        }
        .booking-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .booking-header h1 {
            font-size: 28px;
            letter-spacing: -0.03em;
            margin-bottom: 8px;
        }
        .booking-header p {
            color: #71717a;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="nav-bar">
        <a href="index.html" class="nav-bar__logo">Apex Lab.</a>
        <a href="index.html" class="back-home-link">← Back to Home</a>
    </div>

    <div class="booking-wrapper">
        <div class="booking-card">
            <div class="booking-header">
                <h1>Select Date & Time</h1>
                <p>Secure your signature correction & coating slot. Confirmation details will be sent immediately.</p>
            </div>
            
            <!-- Cal.com inline embed container -->
            <div style="width:100%; height:500px; overflow:scroll;" id="my-cal-inline"></div>
            <script type="text/javascript">
              (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; C.Cal = C.Cal || function () { let am = arguments; if (!C.Cal.q) { C.Cal.q = []; } p(C.Cal, am); }; C.Cal.l = () => { let s = A.createElement(L); s.type = "text/javascript"; s.async = true; s.src = "https://app.cal.com/embed/embed.js"; let e = A.getElementsByTagName(L)[0]; e.parentNode.insertBefore(s, e); }; C.Cal.l(); })(window, document, "script");
              Cal("init", "booking", {origin:"https://cal.com"});
              Cal.ns.booking("inline", {
                elementOrSelector:"#my-cal-inline",
                calLink: "apex-lab/signature-detail",
                layout: "month_view"
              });
              Cal.ns.booking("ui", {"theme":"dark","styles":{"body":{"background":"#0c0c0e"},"branding":{"brandColor":"#ffffff"}}});
            </script>
        </div>
    </div>

</body>
</html>
